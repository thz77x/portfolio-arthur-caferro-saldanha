<head>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">PixelRealm 2</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Início</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="sobre.html">Sobre</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="galeria.html">Galeria</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="dados.html">Dados</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="contato.html">Contato</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <main>
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow border-secondary bg-dark text-white p-4">
                    <h1 class="mb-4 text-center">Contato</h1>

                    <form>
                        <div class="mb-3">
                            <label for="nome" class="form-label text-white">Nome:</label>
                            <input type="text" class="form-control" id="nome" name="nome" placeholder="Digite seu nome">
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label text-white">E-mail:</label>
                            <input type="email" class="form-control" id="email" name="email" placeholder="Digite seu e-mail">
                        </div>

                        <div class="mb-3">
                            <label for="assunto" class="form-label text-white">Assunto:</label>
                            <select class="form-select" id="assunto" name="assunto">
                                <option value="" selected disabled>Selecione uma opção</option>
                                <option value="duvida">Dúvida</option>
                                <option value="sugestao">Sugestão</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="mensagem" class="form-label text-white">Mensagem:</label>
                            <textarea class="form-control" id="mensagem" name="mensagem" rows="4" placeholder="Digite sua mensagem"></textarea>
                        </div>

                        <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="aceito" name="aceito">
                                <label class="form-check-label" for="aceito">
                                    Aceito os termos
                                </label>
                            </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">Enviar Dados</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

    <footer class="text-center">

</body>

</html>
