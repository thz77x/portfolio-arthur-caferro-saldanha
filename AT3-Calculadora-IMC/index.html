<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de IMC</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }
    .container {
      width: 100%;
      max-width: 420px;
      padding: 28px;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 8px 28px rgba(15, 23, 42, .10);
    }
    h1 { margin-top: 0; text-align: center; }
    label { display: block; margin: 16px 0 6px; font-weight: bold; }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    #resultado {
      margin-top: 20px;
      padding: 14px;
      border-radius: 8px;
      background: #eff6ff;
      text-align: center;
      line-height: 1.5;
    }
    .aviso {
      margin: 18px 0 0;
      color: #64748b;
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Calculadora de IMC</h1>

    <form id="formulario-imc">
      <label for="peso">Peso (kg):</label>
      <input type="number" id="peso" min="0.1" step="any"
             placeholder="Ex.: 70" required>

      <label for="altura">Altura (m):</label>
      <input type="number" id="altura" min="0.1" step="any"
             placeholder="Ex.: 1.75" required>

      <button type="submit">Calcular IMC</button>
    </form>

    <div id="resultado" role="status" aria-live="polite">
      Informe o peso e a altura para realizar o cálculo.
    </div>

    <p class="aviso">
      As faixas exibidas são referências gerais para adultos. Para menores de
      18 anos, a interpretação do IMC depende da idade e de curvas de
      crescimento, portanto esta classificação não deve ser utilizada.
    </p>
  </main>

  <script>
    const formulario = document.getElementById("formulario-imc");
    const resultado = document.getElementById("resultado");

    formulario.addEventListener("submit", function(event) {
      event.preventDefault();

      const peso = Number(document.getElementById("peso").value);
      const altura = Number(document.getElementById("altura").value);

      if (!Number.isFinite(peso) || !Number.isFinite(altura) ||
          peso <= 0 || altura <= 0) {
        resultado.textContent = "Informe valores válidos para peso e altura.";
        return;
      }

      // Fórmula: IMC = peso / (altura * altura)
      const imc = peso / (altura * altura);
      let classificacao;

      if (imc < 18.5) {
        classificacao = "Baixo peso";
      } else if (imc < 25) {
        classificacao = "Peso normal";
      } else if (imc < 30) {
        classificacao = "Sobrepeso";
      } else if (imc < 35) {
        classificacao = "Obesidade grau I";
      } else if (imc < 40) {
        classificacao = "Obesidade grau II";
      } else {
        classificacao = "Obesidade grau III";
      }

      resultado.innerHTML =
        `IMC calculado: <strong>${imc.toFixed(2).replace(".", ",")} kg/m²</strong><br>` +
        `Classificação pela tabela adulta: <strong>${classificacao}</strong>`;
    });
  </script>
</body>
</html>
